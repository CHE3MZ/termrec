name: test
on:
  push:
  pull_request:

jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Full tests (no cache)
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./internal/render/ ./internal/theme/ ./internal/timing/ ./internal/config/ ./internal/recording/
      - name: Render check (all fixtures + variants)
        run: sh scripts/render-check.sh
        shell: sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.os }}
          path: logs/
      - uses: actions/upload-artifact@v4
        with:
          name: check-gifs-${{ matrix.os }}
          path: dist/check-*.gif
