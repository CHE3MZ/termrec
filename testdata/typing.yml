# termrec recording: progressive typing demo (keystroke-level records).
# Renders as smooth writing animation with visible cursor.
config:
  command: bash -l
  cwd: .
  env:
    recording: "true"
  cols: 44
  rows: 8
  repeat: 0
  quality: 100
  frameDelay: auto
  maxIdleTime: 2000
  frameBox:
    type: floating
    title: Terminalizer
    style:
      border: 0px black solid
  watermark:
    imagePath: null
    style:
      position: absolute
      right: 15px
      bottom: 15px
      width: 100px
      opacity: "0.9"
  cursorStyle: block
  fontFamily: Monaco, Monospace
  fontFile: null
  fontSize: 16
  lineHeight: 1
  letterSpacing: 0
  theme:
    background: "transparent"
    foreground: "#bbbbbb"
    cursor: "#c7c7c7"
    black: "#000000"
    red: "#cd3131"
    green: "#0dbc79"
    yellow: "#e5e510"
    blue: "#2472c8"
    magenta: "#bc3fbc"
    cyan: "#11a8cd"
    white: "#e5e5e5"
    brightBlack: "#666666"
    brightRed: "#f14c4c"
    brightGreen: "#23d18b"
    brightYellow: "#f5f543"
    brightBlue: "#3b8eea"
    brightMagenta: "#d670d6"
    brightCyan: "#29b8db"
    brightWhite: "#e5e5e5"
records:
  - delay: 500
    content: "\x1b[37m$\x1b[0m "
  - delay: 110
    content: "e"
  - delay: 90
    content: "c"
  - delay: 120
    content: "h"
  - delay: 100
    content: "o"
  - delay: 130
    content: " "
  - delay: 110
    content: "h"
  - delay: 95
    content: "e"
  - delay: 105
    content: "l"
  - delay: 100
    content: "l"
  - delay: 115
    content: "o"
  - delay: 90
    content: " "
  - delay: 120
    content: "w"
  - delay: 100
    content: "o"
  - delay: 110
    content: "r"
  - delay: 95
    content: "l"
  - delay: 105
    content: "d"
  - delay: 400
    content: "\r\n"
  - delay: 250
    content: "\x1b[32mhello world\x1b[0m\r\n"
  - delay: 700
    content: "\x1b[37m$\x1b[0m "
