  - delay: 800
    content: "\r\n\x1b[?1049h\x1b[2J\x1b[H\x1b[1;37m main.go [+]\x1b[0m\r\n\r\n \x1b[90m1 \x1b[0m\x1b[33mpackage\x1b[0m main\r\n \x1b[90m2\x1b[0m\r\n \x1b[90m3 \x1b[0m\x1b[33mimport\x1b[0m \x1b[32m\"fmt\"\x1b[0m\r\n \x1b[90m4\x1b[0m\r\n \x1b[90m5 \x1b[0m\x1b[33mfunc\x1b[0m \x1b[36mmain\x1b[0m() {\r\n \x1b[90m6 \x1b[0m    \x1b[36mfmt\x1b[0m.Println(\x1b[32m\"hi\"\x1b[0m) \x1b[38;5;208m// greet\x1b[0m\r\n \x1b[90m7 \x1b[0m}\r\n\r\n\r\n\r\n\r\n\r\n\r\n\x1b[44m\x1b[97m main.go [+]                                  6,22  unix  go\x1b[0m\r\n\r\n\x1b[90m ^Q Quit  ^S Save  ^F Find  ^Z Undo  ^Y Redo  ^K Cut\x1b[0m\x1b[8;23H"
