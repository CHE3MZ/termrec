# termrec recording (compatible with terminalizer .yml)
config:
  command: micro main.go
  cwd: .
  env:
    recording: "true"
  cols: 60
  rows: 18
  repeat: 0
  quality: 100
  frameDelay: auto
  maxIdleTime: 2000
  frameBox:
    type: window
    title: micro
    style:
      border: 0px black solid
  watermark:
    imagePath: null
    style:
      position: absolute
      right: 15px
      bottom: 15px
      width: 100px
      opacity: "0.9"
  cursorStyle: block
  fontFamily: "Geist Mono, Monaco, Lucida Console, Ubuntu Mono, Monospace"
  fontFile: null
  fontSize: 12
  lineHeight: 1
  letterSpacing: 0
  theme:
    background: "transparent"
    foreground: "#bbbbbb"
    cursor: "#c7c7c7"
    black: "#000000"
    red: "#cd3131"
    green: "#0dbc79"
    yellow: "#e5e510"
    blue: "#2472c8"
    magenta: "#bc3fbc"
    cyan: "#11a8cd"
    white: "#e5e5e5"
    brightBlack: "#666666"
    brightRed: "#f14c4c"
    brightGreen: "#23d18b"
    brightYellow: "#f5f543"
    brightBlue: "#3b8eea"
    brightMagenta: "#d670d6"
    brightCyan: "#29b8db"
    brightWhite: "#e5e5e5"
records:
  - delay: 600
    content: "\x1b[37m$\x1b[0m "
  - delay: 110
    content: "m"
  - delay: 95
    content: "i"
  - delay: 105
    content: "c"
  - delay: 100
    content: "r"
  - delay: 115
    content: "o"
  - delay: 90
    content: " "
