# termrec recording (compatible with terminalizer .yml)
# Showcase for the Eager Naturalist system font (proportional display face:
# columns won't align like a mono, which is expected and fine for a sample).
config:
  command: echo eager
  cwd: .
  env:
    recording: "true"
  cols: 60
  rows: 10
  repeat: 0
  quality: 100
  frameDelay: auto
  maxIdleTime: 2000
  frameBox:
    type: floating
    title: eager
    style:
      border: 0px black solid
  watermark:
    imagePath: null
    style:
      position: absolute
      right: 15px
      bottom: 15px
      width: 100px
      opacity: "0.9"
  cursorStyle: block
  fontFamily: "Eager Naturalist, Monospace"
  fontFile: null
  fontSize: 16
  lineHeight: 1
  letterSpacing: -2
  theme:
    background: "transparent"
    foreground: "#bbbbbb"
    cursor: "#c7c7c7"
    black: "#000000"
    red: "#cd3131"
    green: "#0dbc79"
    yellow: "#e5e510"
    blue: "#2472c8"
    magenta: "#bc3fbc"
    cyan: "#11a8cd"
    white: "#e5e5e5"
    brightBlack: "#666666"
    brightRed: "#f14c4c"
    brightGreen: "#23d18b"
    brightYellow: "#f5f543"
    brightBlue: "#3b8eea"
    brightMagenta: "#d670d6"
    brightCyan: "#29b8db"
    brightWhite: "#e5e5e5"
records:
  - delay: 600
    content: "\x1b[37m$\x1b[0m "
  - delay: 110
    content: "E"
  - delay: 95
    content: "a"
  - delay: 105
    content: "g"
  - delay: 100
    content: "e"
  - delay: 115
    content: "r"
  - delay: 90
    content: " "
  - delay: 120
    content: "N"
  - delay: 100
    content: "a"
  - delay: 95
    content: "t"
  - delay: 110
    content: "u"
  - delay: 105
    content: "r"
  - delay: 100
    content: "a"
  - delay: 115
    content: "l"
  - delay: 90
    content: "i"
  - delay: 120
    content: "s"
  - delay: 100
    content: "t"
  - delay: 95
    content: " "
  - delay: 110
    content: "1"
  - delay: 105
    content: "2"
  - delay: 100
    content: "3"
  - delay: 400
    content: "\r\n"
  - delay: 105
    content: "T"
  - delay: 95
    content: "h"
  - delay: 110
    content: "e"
  - delay: 100
    content: " "
  - delay: 115
    content: "q"
  - delay: 90
    content: "u"
  - delay: 120
    content: "i"
  - delay: 100
    content: "c"
  - delay: 95
    content: "k"
  - delay: 110
    content: " "
  - delay: 105
    content: "b"
  - delay: 100
    content: "r"
  - delay: 115
