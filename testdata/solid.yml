# termrec recording (compatible with terminalizer .yml)
config:
  command: echo hi
  cwd: .
  env:
    recording: "true"
  cols: 40
  rows: 10
  repeat: 0
  quality: 100
  frameDelay: auto
  maxIdleTime: 2000
  frameBox:
    type: solid
    title: Terminalizer
    style:
      border: 0px black solid
  watermark:
    imagePath: null
    style:
      position: absolute
      right: 15px
      bottom: 15px
      width: 100px
      opacity: "0.9"
  cursorStyle: block
  fontFamily: Monaco, Monospace
  fontSize: 12
  lineHeight: 1
  letterSpacing: 0
  theme:
    background: "transparent"
    foreground: "#afafaf"
    cursor: "#c7c7c7"
    black: "#232628"
    red: "#fc4384"
    green: "#b3e33b"
    yellow: "#ffa727"
    blue: "#75dff2"
    magenta: "#ae89fe"
    cyan: "#708387"
    white: "#d5d5d0"
    brightBlack: "#626566"
    brightRed: "#ff7fac"
    brightGreen: "#c8ed71"
    brightYellow: "#ebdf86"
    brightBlue: "#75dff2"
    brightMagenta: "#ae89fe"
    brightCyan: "#b1c6ca"
    brightWhite: "#f9f9f4"
records:
  - delay: 500
    content: "\x1b[35m$\x1b[0m "
  - delay: 500
    content: "hello termrec\r\n"
  - delay: 600
    content: "\x1b[32mgreen line\x1b[0m\r\n"
  - delay: 800
    content: "done\r\n"
  - delay: 800
    content: "\x1b[35m$\x1b[0m "
