version: '3'

tasks:
  build:
    desc: Build termrec binary into dist/
    cmds:
      - sh scripts/build.sh

  vet:
    desc: go vet only (quick)
    cmds:
      - go vet ./...

  lint:
    desc: Full lint (bugcheck + seccheck), run constantly
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh

  lint-quick:
    desc: vet only
    cmds:
      - go vet ./...

  test:
    desc: go test ./...
    cmds:
      - go test ./...

  test-short:
    desc: Quick tests
    cmds:
      - go test -short ./...

  render-sample:
    desc: Smoke render testdata/demo.yml -> dist/demo.gif
    cmds:
      - sh scripts/render-sample.sh

  render-micro:
    desc: Complex editor demo testdata/micro.yml -> dist/micro.gif
    cmds:
      - sh scripts/render-micro.sh

  render-hyperfine:
    desc: Typed benchmark demo testdata/hyperfine.yml -> dist/hyperfine.gif
    cmds:
      - sh scripts/render-hyperfine.sh

  render-check:
    desc: Render all fixtures + variants with verification
    cmds:
      - sh scripts/render-check.sh
  clean-dist-dir:
    desc: cleanup the dist dir
    cmds:
      - rm -rf dist
      - mkdir -p dist
    silent: true
  default:
    desc: build
    cmds:
      - task: clean-dist-dir
      - task: build
      - task: render-sample
      - task: render-check
